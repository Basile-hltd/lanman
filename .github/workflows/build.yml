name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (universel arm64 + x86_64)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build
          ./build/lanman --version
          tar -czf lanman-macos-universal.tar.gz -C build lanman
      - uses: actions/upload-artifact@v4
        with:
          name: lanman-macos
          path: lanman-macos-universal.tar.gz

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (statique musl, tourne sur toutes les distributions)
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:latest sh -c '
            apk add --no-cache build-base cmake git &&
            cmake -S . -B build -DCMAKE_BUILD_TYPE=MinSizeRel -DLANMAN_FULLY_STATIC=ON &&
            cmake --build build &&
            ./build/lanman --version'
          file build/lanman
          tar -czf lanman-linux-x64.tar.gz -C build lanman
      - uses: actions/upload-artifact@v4
        with:
          name: lanman-linux
          path: lanman-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build
          cmake --build build --config MinSizeRel
          ./build/MinSizeRel/lanman.exe --version
          Compress-Archive -Path build/MinSizeRel/lanman.exe -DestinationPath lanman-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lanman-windows
          path: lanman-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "lanman ${GITHUB_REF_NAME#v}" --generate-notes
